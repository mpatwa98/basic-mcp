[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
# Target line length (88 is standard, but 120 is highly popular for FastAPI)
line-length = 120

[tool.ruff.lint]
# Choose which rule sets to enforce
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes (catches unused imports/variables)
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear (common design bugs)
    "UP", # pyupgrade (upgrades old syntax to newer Python versions)
]

ignore = [
    "E501", # Ignore line-length violations (let the formatter handle it or allow long lines)
]
